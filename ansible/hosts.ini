# Inventário do Ansible (executado a partir da VM1, o nó de controle)

[controle]
vm1 ansible_connection=local

[backend]
vm2 ansible_host=192.168.56.11

[backend:vars]
ansible_user=vagrant
# Chave SSH gerada pelo Vagrant para a VM2 (pasta do projeto montada em /vagrant_data)
ansible_ssh_private_key_file=/vagrant_data/.vagrant/machines/vm2/virtualbox/private_key
